version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: occ_postgres
    environment:
      POSTGRES_USER: occ
      POSTGRES_PASSWORD: occ_password
      POSTGRES_DB: occ_db
    ports:
      - "5432:5432"
    volumes:
      - occ_pgdata:/var/lib/postgresql/data

volumes:
  occ_pgdata:
